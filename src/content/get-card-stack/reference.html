<!--
  Reference HTML for timeline container (card stack) structure
  
  This file shows the HTML structure of the timeline container that holds
  all tweet cards. The getCardStack() function searches for this element.
  
  The key selector is: div[aria-label*="Timeline"] where aria-label contains "Home Timeline"
-->

<!-- Example timeline container structure -->
<div aria-label="Home Timeline" role="feed">
    <!-- This is the container that holds all tweet cards -->
    <!-- The getCardStack() function finds this element by its aria-label -->
    
    <!-- Tweet cards are nested inside this container -->
    <div data-testid="cellInnerDiv">
        <article data-testid="tweet">
            <!-- Tweet card content -->
        </article>
    </div>
    
    <div data-testid="cellInnerDiv">
        <article data-testid="tweet">
            <!-- Another tweet card -->
        </article>
    </div>
    
    <!-- More tweet cards... -->
</div>

<!--
  Note: The actual structure may vary, but the key identifier is:
  - Element type: div
  - aria-label attribute contains "Timeline" and specifically "Home Timeline"
-->
