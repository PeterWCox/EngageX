<!--
  Reference HTML for card element injection
  
  This file shows the HTML structure where elements are injected:
  1. Follower count badge - injected near the username
  
  See card.html in the project root for a full example of a tweet card.
-->

<!-- Example tweet card structure showing injection points -->
<article data-testid="tweet">
    <div data-testid="User-Name">
        <!-- Follower badge is injected here, near the username link -->
        <a href="/username">@username</a>
        <!-- Badge appears here: <span class="twitter-extension-follower-badge">790,000 followers</span> -->
    </div>
    
    <!-- Tweet content -->
    <div data-testid="tweetText">Tweet text content...</div>
    
    <!-- Action buttons area -->
    <div role="group">
        <!-- Like, Retweet, Reply buttons -->
    </div>
</article>

<!--
  Injection Details:
  
  1. Follower Badge:
     - Selector: [data-testid="User-Name"] -> finds username container
     - Injected: After username link or its parent container
     - Class: twitter-extension-follower-badge
     - Style: Red background, white text, rounded chip
  
  Full example available in: ../../card.html
-->
